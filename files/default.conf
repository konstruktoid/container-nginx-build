# Replaces the stock Alpine default site, which returns 404 for every request.
# That made the image's HEALTHCHECK impossible to satisfy and the image itself
# useless without a config mounted over it.
server {
	# Unprivileged port: the image runs as the nginx user, which cannot bind 80.
	listen 8080 default_server;
	listen [::]:8080 default_server;

	root /var/lib/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Used by HEALTHCHECK. Not logged, so the access log stays readable.
	# default_type sets the type of the generated response; add_header would
	# append a second Content-Type next to the default application/octet-stream.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	error_page 500 502 503 504 /50x.html;

	location = /50x.html {
		internal;
	}
}
